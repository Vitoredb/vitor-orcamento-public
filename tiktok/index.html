<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>TikTok · Vitor Bortoloto</title>
  <style>
    body{margin:0;background:#0b0c0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}
    main{max-width:520px;padding:32px;text-align:center}
    a{display:inline-block;margin-top:18px;padding:14px 18px;border-radius:12px;background:#fff;color:#111;text-decoration:none;font-weight:700}
    p{color:#b8bcc4;line-height:1.5}
  </style>
</head>
<body>
<main>
  <h1>Abrindo seu atendimento no WhatsApp…</h1>
  <p>Se o WhatsApp não abrir automaticamente, toque no botão abaixo.</p>
  <a id="fallback" href="#">Continuar no WhatsApp</a>
</main>
<script>
  const message = "Olá, Vitor! Conheci seu trabalho pelo TikTok e gostaria de solicitar um orçamento. Posso te enviar o modelo do aparelho e explicar o que aconteceu?";
  const target = "https://wa.me/554598579157?text=" + encodeURIComponent(message);
  document.getElementById("fallback").href = target;
  window.location.replace(target);
</script>
</body>
